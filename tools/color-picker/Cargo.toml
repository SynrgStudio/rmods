[package]
name = "rpack-color-picker"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "color-picker"
path = "src/main.rs"

[dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
arboard = "3.6"
